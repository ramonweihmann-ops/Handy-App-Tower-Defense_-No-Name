# Baut die Android-App und veröffentlicht sie als GitHub-Release (kostenlos bei öffentlichen
# Projekten). Ausgelöst, wenn sich release.json ändert (Versionsname und Hinweistext) oder per Hand.
# Die APK landet nur im Release, nicht im Projektverlauf; docs/pilot/ bekommt Download-Seite
# und version.json (für den Update-Hinweis in der App).
name: Android-Release

on:
  push:
    paths: ["release.json"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: android-release
  cancel-in-progress: false

env:
  GODOT_VERSION: 4.7.2-stable

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Godot aus dem Zwischenspeicher
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}

      - name: Godot und Exportvorlagen laden
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot ~/.local/share/godot/export_templates
          cd ~/godot
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q godot.zip && rm godot.zip
          curl -sSL -o tpl.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz"
          unzip -q tpl.tpz && rm tpl.tpz
          mv templates ~/.local/share/godot/export_templates/${GODOT_VERSION/-/.}

      - name: Android-Einstellungen für Godot
        run: |
          mkdir -p ~/.config/godot ~/.local/share/godot/keystores
          keytool -genkeypair -v -keystore ~/.local/share/godot/keystores/debug.keystore -storepass android \
            -alias androiddebugkey -keypass android -keyalg RSA -validity 10000 -dname "CN=Android Debug,O=Android,C=US" >/dev/null
          cat > ~/.config/godot/editor_settings-4.7.tres <<TRES
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/.local/share/godot/keystores/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          TRES
          sed -i 's/^ *//' ~/.config/godot/editor_settings-4.7.tres

      - name: Version lesen
        id: ver
        run: |
          echo "name=$(python3 -c 'import json;print(json.load(open("release.json"))["name"])')" >> "$GITHUB_OUTPUT"
          echo "notes=$(python3 -c 'import json;print(json.load(open("release.json"))["notes"])')" >> "$GITHUB_OUTPUT"
          echo "tag=pilot-$(date -u +%Y%m%d-%H%M)" >> "$GITHUB_OUTPUT"

      - name: APK bauen
        id: build
        env:
          VNAME: ${{ steps.ver.outputs.name }}
          NOTES: ${{ steps.ver.outputs.notes }}
          RELEASE_URL: https://github.com/${{ github.repository }}/releases/download/${{ steps.ver.outputs.tag }}/
        run: |
          G="$(ls ~/godot/Godot_v*_linux.x86_64)"
          chmod +x "$G"
          GODOT="$G" scripts/build-android.sh

      - name: Release anlegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.ver.outputs.tag }}" "${{ steps.build.outputs.APK_FILE }}" \
            --target "${{ github.sha }}" --prerelease \
            --title "Pilot ${{ steps.ver.outputs.name }}" --notes "${{ steps.ver.outputs.notes }}"

      - name: Download-Seite und Versionsinfo speichern
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/pilot game/build_info.json game/export_presets.cfg
          git commit -m "Pilot ${{ steps.ver.outputs.name }}: Download-Seite und Versionsinfo"
          git push origin "HEAD:${{ github.ref_name }}"
          # Seite neu ausliefern (Pushes mit dem Workflow-Schlüssel stoßen das nicht immer an)
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || true

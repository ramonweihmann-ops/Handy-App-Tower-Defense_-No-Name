<!doctype html>
<html lang="de"><head><meta charset="utf-8"><title>Helden – Vorschau aus Einzelbauteilen</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#15102c;font-family:'Arial Rounded MT Bold','Arial',sans-serif;color:#fff}#seite{width:934px;height:1684px;position:relative;overflow:hidden;background:#191342 url('hintergrund/helden_hintergrund.png') center/cover no-repeat}.teil{position:absolute}.bild{width:100%;height:100%;object-fit:fill;display:block}.schrift{font-weight:900;text-align:center;text-shadow:0 3px 0 #34204c;display:flex;align-items:center;justify-content:center;line-height:1.04}.banner{font-size:47px;letter-spacing:-1px}.zaehler{font-size:37px}.portrait{position:absolute;object-fit:contain}.name{font-size:33px}.klein{font-size:25px}.gold{color:#ffe67a}.stufe{color:#4a2705;text-shadow:none;font-size:29px}.leiste{position:absolute;background:url('ui/fortschritt_schiene.svg') center/100% 100%;overflow:hidden;border-radius:22px}.fuellung{height:100%;border-radius:22px;background:linear-gradient(#a4ecff,#25b6fb)}.fuellung.gold{background:linear-gradient(#fff2a0,#ffd038)}.fuellung.gruen{background:linear-gradient(#c4ff8b,#45db31)}.leistenwert{position:absolute;inset:0;display:flex;justify-content:center;align-items:center;font-weight:900;font-size:24px;text-shadow:0 2px 0 #22163e}.aktionsknopf{background:transparent;border:0;color:#123900;font-weight:900;font-size:31px;position:absolute;padding:0;text-shadow:none}.aktionsknopf span{position:absolute;inset:0;display:flex;justify-content:center;align-items:center;padding-bottom:7px}.aktionsknopf.gesperrt{color:#e9d7ff}.navname{font-size:29px}.grau{filter:grayscale(1) brightness(.73)}
</style></head><body><main id="seite" aria-label="Heldenbildschirm aus wiederverwendbaren Einzelbauteilen"></main>
<script>
const seite=document.querySelector('#seite');
function block(x,y,w,h,cls='teil'){const e=document.createElement('div');e.className=cls;e.style.cssText=`position:absolute;left:${x}px;top:${y}px;width:${w}px;height:${h}px`;seite.appendChild(e);return e}
function bild(src,x,y,w,h,extra=''){const p=block(x,y,w,h);const e=new Image();e.src=src;e.alt=src.split('/').pop();e.className='bild '+extra;p.appendChild(e);return e}
function text(s,x,y,w,h,cls=''){const e=block(x,y,w,h,'teil schrift '+cls);e.textContent=s;return e}
function progress(x,y,w,h,val,max,col,label){const e=block(x,y,w,h,'leiste');const f=document.createElement('div');f.className='fuellung '+col;f.style.width=(100*val/max)+'%';e.appendChild(f);if(label){const l=document.createElement('div');l.className='leistenwert';l.textContent=label;e.appendChild(l)}}
function button(label,x,y,w,h,disabled=false){const e=document.createElement('button');e.className='aktionsknopf'+(disabled?' gesperrt':'');e.style.cssText=`left:${x}px;top:${y}px;width:${w}px;height:${h}px`;e.type='button';e.disabled=true;const im=new Image();im.src='ui/'+(disabled?'knopf_gesperrt':'knopf_gruen_normal')+'.svg';im.className='bild';im.alt='';e.appendChild(im);const s=document.createElement('span');s.textContent=label;e.appendChild(s);seite.appendChild(e)}
bild('ui/banner_gruen.svg',82,60,770,124);text('FREIGESCHALTET',132,78,544,83,'banner');bild('ui/zaehler_dunkel.svg',684,89,124,61);text('4/7',684,89,124,61,'zaehler');
const top=[['lynx','LYNX','violett',3,40,40,'gruen'],['dusty_jo','DUSTY JO','gold',6,15,25,'gold'],['iska','ISKA','cyan',5,7,20,'cyan'],['margot','MARGOT','rosa',4,18,20,'gold']];
top.forEach((a,i)=>{const x=18+i*230;bild('ui/portrait_hintergrund_'+a[2]+'.svg',x,216,210,230);bild('figuren/'+a[0]+'.png',x+2,224,206,210);bild('ui/portrait_rahmen_gold.svg',x,216,210,230);bild('ui/stufe_plakette.svg',x+27,408,156,49);text('Stufe '+a[3],x+27,408,156,49,'stufe');text(a[1],x-5,463,220,45,'name');progress(x+6,516,198,29,a[4],a[5],a[6]);text(a[4]+'/'+a[5]+(i===0?' · bereit':' Karten'),x-5,550,220,38,'klein '+(i===0?'gruen':''));if(i===0)bild('ui/hinweispunkt.svg',x+158,216,49,49)});
bild('ui/banner_rot.svg',34,624,866,111);text('NOCH NICHT FREIGESCHALTET',82,643,690,70,'banner klein');bild('ui/zaehler_dunkel.svg',775,647,82,62);text('3',775,647,82,62,'zaehler');
const low=[['volta','VOLTA','cyan','',2,10,'KAUFEN'],['brocken','BROCKEN','cyan','Starterpaket · 3 Tage',0,10,'ANSEHEN'],['schleimmutter_gesperrt','SCHLEIMMUTTER','rosa','Boss Welt 1 besiegen',0,10,'GESPERRT']];
low.forEach((a,i)=>{const x=17+i*305;bild('ui/kartenkoerper.svg',x,759,290,534);bild('ui/portrait_hintergrund_'+a[2]+'.svg',x+12,771,266,250);bild('figuren/'+a[0]+'.png',x+21,779,248,236,i===1?'grau':'');bild('ui/portrait_rahmen_gold.svg',x+12,771,266,250);text(a[1],x+5,1029,280,55,'name gold'+(i===2?' klein':''));if(a[3])text(a[3],x+24,1093,242,67,'klein gold');progress(x+23,i===0?1130:1164,244,39,a[4],a[5],'cyan',a[4]+'/'+a[5]+(i===2?' · Level 5 nötig':' Karten'));button(a[6],x+15,1211,260,73,i===2);if(i===0){bild('ui/zeit_plakette.svg',x+21,782,150,45);bild('symbole/icon_clock.png',x+24,790,30,30);text('5 Std.',x+52,785,114,40,'klein gold')}if(i!==1)bild('ui/plus.svg',x+229,785,35,35)});
bild('ui/nav_hintergrund.svg',0,1520,934,164);bild('ui/nav_aktiv.svg',196,1530,172,145);const nav=['nav_shop','nav_heroes','nav_battle','nav_upgrades','nav_base'];const labels=['Shop','Helden','Kampf','Upgrades','Basis'];
nav.forEach((n,i)=>{const x=14+i*185;if(i===2){bild('ui/kampf_knopf.svg',x+8,1484,157,157);bild('symbole/'+n+'.png',x+21,1499,129,129)}else bild('symbole/'+n+'.png',x+29,1531,118,101);text(labels[i],x-5,1637,183,39,'navname'+(i===1||i===2?' gold':''))});
</script></body></html>
